[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coerceprobe"
version = "1.0.0"
description = "Authentication-coercion validation for Windows and Active Directory"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kalraji007" }]
keywords = [
  "active-directory",
  "security",
  "red-team",
  "ntlm",
  "coercion",
  "printerbug",
  "petitpotam",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = ["impacket>=0.12.0"]

[project.scripts]
coerceprobe = "coerceprobe:main"

[tool.setuptools]
py-modules = ["coerceprobe"]
